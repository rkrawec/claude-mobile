<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks</title>
<meta name="description" content="A bare-bones offline task tracker.">

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">

<!-- iOS home-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="header">
  <h1>Tasks</h1>
  <p class="subtitle" id="subtitle">Nothing yet</p>
</header>

<form class="composer" id="composer" autocomplete="off">
  <input
    id="input"
    class="composer-input"
    type="text"
    placeholder="Add a task…"
    aria-label="New task"
    enterkeyhint="done"
    maxlength="200">
  <button class="composer-add" type="submit" aria-label="Add task">Add</button>
</form>

<nav class="filters" id="filters" role="tablist" aria-label="Filter tasks">
  <button role="tab" class="filter" data-filter="all" aria-selected="true">All</button>
  <button role="tab" class="filter" data-filter="active" aria-selected="false">Active</button>
  <button role="tab" class="filter" data-filter="done" aria-selected="false">Done</button>
</nav>

<main>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden></p>
</main>

<footer class="footer">
  <button class="clear" id="clear" type="button" hidden>Clear completed</button>
</footer>

<script src="./app.js"></script>
</body>
</html>
